apiVersion: v1
kind: Service
metadata:
  name: syslab-service
  labels:
    app: syslab
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: syslab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syslab-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
