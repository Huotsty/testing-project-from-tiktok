apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslab-platform
  labels:
    app: syslab
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: syslab
  template:
    metadata:
      labels:
        app: syslab
    spec:
      containers:
        - name: syslab-app
          image: syslab-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: STORAGE_DATA_DIR
              value: "/data/storage_nodes"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: syslab-storage
              mountPath: /data/storage_nodes
      volumes:
        - name: syslab-storage
          persistentVolumeClaim:
            claimName: syslab-pvc
