# Fly.io Configuration for SysLab
app = "syslab-platform"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

[[services.http_checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "5s"
  method = "get"
  path = "/healthz"

[mounts]
  source = "syslab_data"
  destination = "/app/server/data"
