version: '3.8'

services:
  # ==========================================
  # SysLab Application Service
  # ==========================================
  syslab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syslab-platform
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - STORAGE_DATA_DIR=/app/server/data/storage_nodes
      - REDIS_URL=redis://syslab-redis:6379
      - AWS_ENDPOINT_URL=http://syslab-floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    volumes:
      - syslab_data:/app/server/data
    depends_on:
      syslab-redis:
        condition: service_healthy
    networks:
      - syslab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # AlphaForge Quant & Trading Engine
  # ==========================================
  quant-terminal:
    build:
      context: ./quant-terminal
      dockerfile: Dockerfile
    container_name: alphaforge-quant-terminal
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    networks:
      - syslab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/assets"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # AlphaForge Ultra-HFT Go Engine (Native Machine Code)
  # ==========================================
  quant-go-engine:
    build:
      context: ./quant-terminal/go-engine
      dockerfile: Dockerfile
    container_name: alphaforge-go-engine
    restart: unless-stopped
    ports:
      - "4050:4050"
    environment:
      - SYMBOL=paxgusdt
      - RISK_STOP_LOSS=2.0
      - RISK_TAKE_PROFIT=4.0
    networks:
      - syslab-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================
  # Redis Distributed Backplane (Scale-Out)
  # ==========================================
  syslab-redis:
    image: redis:7-alpine
    container_name: syslab-redis-backplane
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - syslab-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================
  # Floci: Local Cloud for AI Agents & Dev (AWS Port 4566)
  # MIT-licensed, sub-second boot, zero credentials
  # ==========================================
  floci:
    image: floci/floci:latest
    container_name: syslab-floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - syslab-net

networks:
  syslab-net:
    driver: bridge

volumes:
  syslab_data:
  redis_data:
